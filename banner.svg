<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="50%" stop-color="#150627"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff9"/>
      <stop offset="50%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#00fff9"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bgGrad)"/>

  <!-- grid lines -->
  <g stroke="#1f1440" stroke-width="1" opacity="0.6">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="250" y1="0" x2="250" y2="200"/>
    <line x1="650" y1="0" x2="650" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#00fff9" stroke-width="2" fill="none" filter="url(#glowCyan)">
    <polyline points="20,15 15,15 15,45"/>
    <polyline points="880,15 885,15 885,45"/>
    <polyline points="20,185 15,185 15,155"/>
    <polyline points="880,185 885,185 885,155"/>
  </g>

  <!-- scanline accent -->
  <rect x="0" y="0" width="900" height="3" fill="#ff2bd6" opacity="0.8" filter="url(#glowMagenta)"/>
  <rect x="0" y="197" width="900" height="3" fill="#00fff9" opacity="0.8" filter="url(#glowCyan)"/>

  <!-- glitch shadow layers -->
  <text x="452" y="98" font-family="'Courier New', monospace" font-size="46" font-weight="bold"
        text-anchor="middle" fill="#ff2bd6" opacity="0.5">Abhishek-kumar-sahu</text>
  <text x="448" y="94" font-family="'Courier New', monospace" font-size="46" font-weight="bold"
        text-anchor="middle" fill="#00fff9" opacity="0.5">Abhishek-kumar-sahu</text>

  <!-- main text -->
  <text x="450" y="96" font-family="'Courier New', monospace" font-size="46" font-weight="bold"
        text-anchor="middle" fill="url(#textGrad)" filter="url(#glowCyan)">Abhishek-kumar-sahu</text>

  <!-- subtitle -->
  <text x="450" y="135" font-family="'Courier New', monospace" font-size="16" letter-spacing="4"
        text-anchor="middle" fill="#8be9fd" opacity="0.9">&lt; FULL-STACK DEVELOPER // FASTAPI · LARAVEL · PYTHON &gt;</text>

  <!-- blinking cursor bar -->
  <rect x="620" y="122" width="10" height="18" fill="#ff2bd6" filter="url(#glowMagenta)">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom tag -->
  <text x="450" y="170" font-family="'Courier New', monospace" font-size="12" letter-spacing="2"
        text-anchor="middle" fill="#5b4b8a">[ SYSTEM ONLINE ] [ BUILDING PRODUCTION-GRADE APPS FROM SCRATCH ]</text>
</svg>
